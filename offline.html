<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <title>Offline | Can Ali Rıza Dinç</title>
  <style>
    *{box-sizing:border-box}
    body{
      min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;
      font-family:Inter,system-ui,sans-serif;color:#fff;background:
      radial-gradient(circle at 20% 20%,rgba(79,140,255,.25),transparent 35%),
      radial-gradient(circle at 80% 80%,rgba(103,232,249,.15),transparent 35%),#070b14
    }
    main{
      width:min(600px,100%);padding:44px;border:1px solid rgba(255,255,255,.1);
      border-radius:28px;text-align:center;background:rgba(15,23,42,.7);
      backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.4)
    }
    .icon{
      width:82px;height:82px;margin:0 auto 24px;display:grid;place-items:center;
      border-radius:24px;font-size:2rem;background:linear-gradient(135deg,#4f8cff,#67e8f9)
    }
    h1{margin:0 0 14px;font-size:clamp(2rem,7vw,3.4rem)}
    p{margin:0 auto 28px;max-width:440px;color:#aab7d1;line-height:1.7}
    button{
      padding:14px 28px;border:0;border-radius:999px;color:#fff;font:inherit;
      font-weight:800;background:linear-gradient(90deg,#4f8cff,#67e8f9);cursor:pointer
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">⚡</div>
    <h1>You're offline</h1>
    <p>The portfolio cannot reach the internet right now. Previously cached pages may still be available.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
